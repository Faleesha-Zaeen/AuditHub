# =============================================================================
# AuditHub - pyproject.toml
# =============================================================================
# Build configuration, linter settings, and test configuration.

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audithub"
version = "0.1.0"
description = "End-to-end Dataset Quality, Repair, Robustness and MLOps Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AuditHub Team" },
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "streamlit>=1.37.0",
    "fastapi>=0.111.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.1",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.31",
    "mlflow>=2.15.1",
    "dvc>=3.50.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "ruff>=0.5.0",
    "mypy>=1.10.1",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.29",
]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = """
/(
    .git
  | .mypy_cache
  | .pytest_cache
  | .ruff_cache
  | .venv
  | venv
  | __pycache__
  | mlruns
  | artifacts
  | data
  | build
  | dist
)/
"""

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["audithub"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # Line length handled by Black
    "N818",  # Exception suffix
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    '.git',
    '.venv',
    'venv',
    'mlruns',
    'artifacts',
    'data',
    'build',
    'dist',
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--no-header"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke/sanity tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "**/__init__.py",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise AuditHubException",
]
